name: Catalogue contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check out the shared catalogue contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Hearmeman24/comfyui-qwen-template
          ref: eabb1ce7891f67e914fe801ac0b237e9e2338ce3
          path: .catalog-validator
          sparse-checkout: tools
          persist-credentials: false
      - name: Validate every workflow and its catalogue entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: node .catalog-validator/tools/catalog-contract.mjs --root . --base-ref "$BASE_SHA"
